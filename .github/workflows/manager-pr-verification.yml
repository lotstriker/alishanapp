name: Manager PR verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [manager-control-center-redesign]

permissions:
  contents: read

concurrency:
  group: manager-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test suite and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build production client
        run: npm run build
      - name: Run automated tests
        run: npm test
