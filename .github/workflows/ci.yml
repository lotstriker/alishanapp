name: Alishan App CI

on:
  push:
    branches: [main, "roadmap/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alishan-app-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Node 24 tests and client build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run backend and application tests
        run: npm test
      - name: Build production client
        run: npm run build
