<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alishan Manager</title>
<link rel="stylesheet" href="/themes.css">
<link rel="stylesheet" href="/nav.css">
<script src="/theme-boot.js"></script>
<style>
* { box-sizing:border-box; }
body { margin:0; min-height:100dvh; font:1rem var(--nav-font); background:var(--bg-body,#f5f7fb); color:var(--text-primary,#212529); }
.manager-header { background:linear-gradient(135deg,var(--nav-bg-a),var(--nav-bg-b)); color:var(--nav-text); }
.manager-header nav, main { max-width:70rem; margin:auto; padding:1rem; }
.manager-header nav, .heading, article, .actions { display:flex; align-items:center; justify-content:space-between; gap:.75rem; flex-wrap:wrap; }
.manager-header strong { font-size:1.15rem; font-weight:800; }
.manager-header a { color:inherit; }
h1 { margin:.5rem 0; font-size:clamp(1.6rem,5vw,2.4rem); }
h2 { font-size:1.15rem; margin:1.25rem 0 .6rem; }
h3 { margin:0 0 .3rem; overflow-wrap:anywhere; }
p { color:var(--text-secondary,#555e67); margin:.25rem 0; }
article, .summary-card { background:var(--bg-card,#fff); border:1px solid var(--border-primary,#e9ecef); border-radius:12px; padding:15px; box-shadow:0 2px 6px var(--shadow-color,#0001); }
article { margin-bottom:.6rem; }
.filters { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; margin:12px 0; }
.summary-card { display:flex; flex-direction:column; align-items:flex-start; gap:5px; text-align:left; }
.summary-card strong { font-size:clamp(1.1rem,2vw,1.45rem); }
button { font:inherit; padding:.55rem .85rem; min-height:44px; color:inherit; background:var(--bg-card,#fff); border:1px solid var(--border-secondary,#dee2e6); border-radius:10px; cursor:pointer; }
button[aria-pressed="true"], button[data-decision="approved"] { border-color:var(--primary,#4361ee); }
button:focus-visible, a:focus-visible { outline:2px solid var(--primary,#4361ee); outline-offset:2px; }
button:disabled { opacity:.55; cursor:wait; }
@media(max-width:800px) { .filters { gap:9px; } .summary-card { padding:12px; } }
@media(max-width:520px) { .actions { width:100%; } .actions button { flex:1; } .filters { grid-template-columns:repeat(2,minmax(0,1fr)); } }
</style>
<body><script>document.body.className=document.documentElement.className;</script>
<header class="manager-header"><nav><strong>Alishan Manager</strong><a href="/">Inventory app</a></nav></header>
<main>
  <div class="heading"><h1>Approval requests</h1><button id="refresh" type="button">Refresh</button></div>
  <p id="status" role="status">Loading requests…</p>
  <div class="filters" aria-label="Filter pending requests">
    <button class="summary-card" data-filter="all" aria-pressed="true" type="button"><strong>—</strong>All pending</button>
    <button class="summary-card" data-filter="archive" aria-pressed="false" type="button"><strong>—</strong>Archive</button>
    <button class="summary-card" data-filter="restore" aria-pressed="false" type="button"><strong>—</strong>Restore</button>
  </div>
  <section aria-labelledby="pending"><h2 id="pending">Pending</h2><div id="queue"></div></section>
  <section aria-labelledby="history"><h2 id="history">Recent decisions</h2><div id="decisions"></div></section>
</main>
<script>
'use strict';
const queue = document.getElementById('queue');
const history = document.getElementById('decisions');
const status = document.getElementById('status');
const refresh = document.getElementById('refresh');
const filters = [...document.querySelectorAll('[data-filter]')];
let rows = [], filter = 'all';
function render() {
  const pending = rows.filter(row => row.status === 'pending');
  const matches = (row, action) => action === 'all' || row.action === action;
  for (const control of filters) {
    control.setAttribute('aria-pressed', String(control.dataset.filter === filter));
    control.querySelector('strong').textContent = pending.filter(row => matches(row,control.dataset.filter)).length;
  }
  const visible = pending.filter(row => matches(row,filter));
  const decided = rows.filter(row => row.status !== 'pending');
  queue.replaceChildren(...(visible.length ? visible.map(card) : [element('p','No pending requests in this view.')]));
  history.replaceChildren(...(decided.length ? decided.map(card) : [element('p','No decisions yet.')]));
}
for (const control of filters) control.addEventListener('click', () => {
  filter = control.dataset.filter;
  render();
});
function element(tag, text) {
  const node = document.createElement(tag);
  node.textContent = text;
  return node;
}
async function api(path, body) {
  const headers = {'X-Alishan-Scope':'__SESSION_SCOPE__'};
  const options = { headers, cache:'no-store', signal:AbortSignal.timeout(30000) };
  if (body) {
    options.method = 'POST';
    options.body = JSON.stringify(body);
    headers['Content-Type'] = 'application/json';
  }
  const response = await fetch(path, options);
  const data = await response.json();
  if (!response.ok) throw new Error(data.error || 'Could not complete the request.');
  return data;
}
function card(row) {
  const article = element('article','');
  const title = element('div','');
  const action = row.action === 'archive' ? 'Archive' : 'Restore';
  title.append(element('h3',row.label || 'Entry'), element('p',action + ' · ' + row.status +
    ' · ' + new Date(row.decided_at || row.requested_at).toLocaleString()));
  article.append(title);
  if (row.status === 'pending') {
    const actions = element('div','');
    actions.className = 'actions';
    for (const [decision, label] of [['approved','Approve'],['rejected','Reject']]) {
      const button = element('button',label);
      button.dataset.decision = decision;
      button.addEventListener('click',async () => {
        for (const control of actions.children) control.disabled = true;
        try {
          await api('/api/manager/requests/' + encodeURIComponent(row.id), {decision});
          await load();
        } catch (error) {
          status.textContent = error.message;
          for (const control of actions.children) control.disabled = false;
        }
      });
      actions.append(button);
    }
    article.append(actions);
  }
  return article;
}
async function load() {
  refresh.disabled = true;
  status.textContent = 'Loading requests…';
  try {
    ({ requests: rows } = await api('/api/manager/requests'));
    render();
    status.textContent = '';
  } catch (error) { status.textContent = error.message; }
  finally { refresh.disabled = false; }
}
refresh.addEventListener('click',load);
void load();
</script>
</body>
</html>
