<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17171b"><title>Alishan - Quality History</title><script src="theme-boot.js"></script><script src="icons.js"></script><link rel="stylesheet" href="dashboard.css"><link rel="stylesheet" href="inventory.css"><link rel="stylesheet" href="item-card.css"><link rel="stylesheet" href="item-modal.css"><link rel="stylesheet" href="nav.css"><link rel="stylesheet" href="themes.css"><link rel="stylesheet" href="mobile.css">
<style>
/* Shared, theme-aware layout for the two audit pages. */
.audit-page{width:min(1180px,100%);margin:0 auto;padding:26px 20px 42px;flex:1;color:var(--text-primary,var(--dark,#212529))}
.audit-hero{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:22px 24px;margin-bottom:20px;border:1px solid var(--border-primary,var(--light-gray));border-radius:16px;background:var(--bg-card,var(--white));box-shadow:0 5px 18px var(--shadow-color,rgba(0,0,0,.07))}
.audit-hero-main{display:flex;align-items:center;gap:16px;min-width:0}
.audit-hero-icon{width:54px;height:54px;flex:0 0 54px;border-radius:15px;display:grid;place-items:center;background:color-mix(in srgb,var(--primary) 13%,var(--bg-card));color:var(--accent-text,var(--primary));font-size:23px}
.audit-hero h1{font-size:clamp(1.35rem,3vw,1.8rem);line-height:1.2;margin:0 0 5px;color:var(--text-primary,var(--dark))}
.audit-hero p{margin:0;color:var(--text-secondary,var(--gray));font-size:.92rem}
.audit-back{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 15px;border-radius:10px;background:var(--primary);color:var(--on-color,#fff);font-weight:700;text-decoration:none;white-space:nowrap;transition:filter .18s,transform .18s}
.audit-back:hover{filter:brightness(1.08);transform:translateY(-1px)}
.audit-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 2px 14px;color:var(--text-secondary,var(--gray));font-size:.9rem}
.audit-count{font-weight:700;color:var(--text-primary,var(--dark))}
.audit-list{display:grid;gap:14px}
.audit-entry,.missing-entry{min-width:0;background:var(--bg-card,var(--white));color:var(--text-primary,var(--dark));border:1px solid var(--border-primary,var(--light-gray));border-radius:15px;padding:18px 20px;box-shadow:0 4px 14px var(--shadow-color,rgba(0,0,0,.055));transition:border-color .18s,transform .18s,box-shadow .18s}
.audit-entry:hover,.missing-entry:hover{border-color:var(--primary);box-shadow:0 7px 20px var(--shadow-color,rgba(0,0,0,.09));transform:translateY(-1px)}
.audit-entry-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-bottom:13px;border-bottom:1px solid var(--border-primary,var(--light-gray))}
.audit-event{display:inline-flex;align-items:center;gap:7px;padding:6px 11px;border-radius:999px;background:color-mix(in srgb,var(--primary) 13%,var(--bg-card));color:var(--accent-text,var(--primary));font-size:.78rem;font-weight:800;letter-spacing:.02em}
.audit-time{font-size:.82rem;color:var(--text-secondary,var(--gray));font-weight:600}
.audit-quality-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin:14px 0 12px}
.audit-quality-head h3,.missing-entry h3{font-size:1.12rem;line-height:1.35;margin:0;color:var(--text-primary,var(--dark));overflow-wrap:anywhere}
.audit-quality-id{display:inline-block;margin-top:4px;color:var(--text-secondary,var(--gray));font-size:.8rem;font-weight:650}
.audit-product{align-self:flex-start;padding:5px 9px;border:1px solid var(--border-secondary,var(--light-gray));border-radius:8px;color:var(--text-secondary,var(--gray));font-size:.76rem;font-weight:700;white-space:nowrap}
.audit-change-list{display:grid;gap:9px;margin-top:10px}
.audit-change{display:grid;grid-template-columns:minmax(130px,.8fr) minmax(0,1fr) minmax(0,1fr);gap:12px;align-items:center;padding:11px 12px;border:1px solid var(--border-primary,var(--light-gray));border-radius:10px;background:var(--bg-body,var(--body-bg))}
.audit-field{font-size:.86rem;font-weight:750;color:var(--text-primary,var(--dark));overflow-wrap:anywhere}
.audit-value{min-width:0;display:grid;gap:3px;overflow-wrap:anywhere;font-size:.86rem;color:var(--text-primary,var(--dark))}
.audit-value small{font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;color:var(--text-secondary,var(--gray));font-weight:800}
.audit-value.new small{color:var(--text-success,#16a34a)}
.audit-empty{display:grid;justify-items:center;text-align:center;gap:9px;padding:42px 20px;border:1px dashed var(--border-secondary,var(--light-gray));border-radius:16px;background:var(--bg-card,var(--white));color:var(--text-secondary,var(--gray))}
.audit-empty-icon{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--primary) 12%,var(--bg-card));color:var(--primary);font-size:22px}
.audit-empty strong{font-size:1.05rem;color:var(--text-primary,var(--dark))}
.missing-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.missing-entry{display:flex;flex-direction:column;gap:13px}
.missing-card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding-bottom:12px;border-bottom:1px solid var(--border-primary,var(--light-gray))}
.missing-card-head h3{font-size:1.1rem}
.missing-code{display:block;margin-top:4px;color:var(--text-secondary,var(--gray));font-size:.8rem;font-weight:650}
.missing-status{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border-radius:999px;font-size:.72rem;font-weight:800;white-space:nowrap}
.missing-status.completed{background:rgba(22,163,74,.13);color:#16a34a}
.missing-status.incomplete{background:rgba(245,158,11,.15);color:#b7791f}
.missing-details{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.missing-detail{min-width:0;padding:10px 11px;border-radius:10px;background:var(--bg-body,var(--body-bg));border:1px solid var(--border-primary,var(--light-gray))}
.missing-detail span{display:block;font-size:.7rem;text-transform:uppercase;letter-spacing:.045em;font-weight:750;color:var(--text-secondary,var(--gray));margin-bottom:3px}
.missing-detail strong{display:block;font-size:.93rem;color:var(--text-primary,var(--dark));overflow-wrap:anywhere}
.missing-detail.pending strong{color:var(--accent-text,var(--primary));font-size:1.1rem}
.missing-actions{margin-top:auto;padding-top:2px}
.audit-btn{display:flex;width:100%;align-items:center;justify-content:center;gap:8px;padding:11px 14px;border-radius:10px;background:var(--primary);color:var(--on-color,#fff);font-size:.88rem;font-weight:750;border:0;cursor:pointer;transition:filter .18s,transform .18s}
.audit-btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
@media(max-width:700px){.audit-page{padding:17px 12px 30px}.audit-hero{padding:16px;align-items:flex-start}.audit-hero-icon{width:45px;height:45px;flex-basis:45px;font-size:19px}.audit-hero-main{gap:11px}.audit-hero p{font-size:.83rem}.audit-back{padding:9px 11px;font-size:.82rem}.missing-grid{grid-template-columns:1fr}.audit-entry,.missing-entry{padding:15px}.audit-change{grid-template-columns:1fr 1fr;gap:9px}.audit-field{grid-column:1/-1;padding-bottom:6px;border-bottom:1px solid var(--border-primary,var(--light-gray))}}
@media(max-width:430px){.audit-hero{flex-wrap:wrap}.audit-back{margin-left:56px}.audit-change{grid-template-columns:1fr 1fr}.audit-field{grid-column:1/-1}.missing-details{gap:8px}.missing-detail{padding:9px}}
.audit-entry-tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-left:auto}
.audit-delete{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border:1px solid var(--danger,#dc2626);border-radius:8px;background:transparent;color:var(--danger,#dc2626);font:inherit;font-size:.78rem;font-weight:800;cursor:pointer;transition:background .18s,color .18s}
.audit-delete:hover{background:var(--danger,#dc2626);color:#fff}
.audit-delete:disabled{opacity:.6;cursor:progress}
.audit-change .audit-value{text-align:left}
.audit-change .audit-value.new{text-align:right}
.audit-change .audit-value.new small,.audit-change .audit-value.new span{justify-self:end}
</style><style>html,body{min-height:100%;background:var(--bg-body,var(--body-bg,#f5f7fb));color:var(--text-primary,var(--dark,#212529))}body{display:flex;flex-direction:column}.site-topbar{flex-shrink:0}</style></head><body><header class="site-topbar"><div class="site-topbar-inner"><a href="index.html" class="logo">ALISHAN</a><nav class="site-nav-links"><ul><li><a href="index.html">DASHBOARD</a></li><li><a href="inventory.html">INVENTORY</a></li></ul></nav></div></header><main class="audit-page"><section class="audit-hero"><div class="audit-hero-main"><div class="audit-hero-icon"><i class="fas fa-clock-rotate-left"></i></div><div><h1>Quality History</h1><p>A record of important changes made to your qualities.</p></div></div><a class="audit-back" href="index.html"><i class="fas fa-arrow-left"></i> Dashboard</a></section><div id="pageContent" class="audit-list"><div class="audit-empty">Loading…</div></div></main><script src="db.js"></script><script src="loader.js"></script><script src="calc.js"></script><script src="store.js"></script><script src="item-form.js"></script><script src="item-card.js"></script><script src="item-modal.js"></script><script src="audit-pages.js"></script></body></html>
